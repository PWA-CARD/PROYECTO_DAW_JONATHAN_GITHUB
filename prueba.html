<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Pantalla login</title>

  <!-- Bootstrap 5 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    body {
      background-color: #e5e5e5;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    }

    .phone-frame {
      width: 375px;
      height: 640px;
      background-color: #d9d9d9;
      padding: 24px;
    }

    .top-text {
      font-size: 0.9rem;
      color: #ff7f9f;
      margin-bottom: 2rem;
    }

    .screen-title {
      font-size: 1rem;
      font-weight: 600;
      text-align: center;
      margin-bottom: 1.75rem;
      color: #333;
    }

    .avatar {
      width: 52px;
      height: 52px;
      border-radius: 50%;
      overflow: hidden;
      margin-right: 12px;
    }

    .avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .user-subtitle {
      font-size: 0.72rem;
      color: #9b9b9b;
      line-height: 1.3;
    }

    .form-card {
      border-radius: 0.7rem;
    }

    .btn-register {
      background-color: #262626;
      border-color: #262626;
      color: white;
    }

    .btn-register:hover {
      background-color: #fffdfd;
      border-color: #111;
    }

    .check-desc {
      font-size: 0.75rem;
      color: #7e7e7e;
    }
  </style>
</head>
<body>

<div class="phone-frame shadow-sm">
  <div class="top-text">Login</div>

  <div class="screen-title">Musculación y Acondicionamiento</div>

  <!-- Bloque usuario -->
  <div class="d-flex align-items-center mb-3">
    <div class="avatar">
      <!-- Cambia la imagen por la tuya -->
      <img src="img/9082355.jpg" alt="Avatar">
    </div>
    <div>
      <h6 class="mb-1">Nombre</h6>
      <p class="user-subtitle mb-0">
        Rol ejercido (cliente, entrenador,<br>
        empleado, gerente,...)
      </p>
    </div>
  </div>

  <!-- Tarjeta formulario -->
  <div class="card form-card mt-2">
    <div class="card-body">
      <form>
        <div class="mb-3">
          <label for="email" class="form-label mb-1">Email</label>
          <input type="email" class="form-control form-control-sm" id="email" placeholder="Value">
        </div>

        <div class="mb-3">
          <label for="password" class="form-label mb-1">Contraseña</label>
          <input type="password" class="form-control form-control-sm" id="password" placeholder="Value">
        </div>

        <div class="form-check mb-3 d-flex">
          <input class="form-check-input me-2" type="checkbox" value="" id="checkLabel" checked>
          <div>
            <label class="form-check-label" for="checkLabel">
              Marcar opción
            </label>
            <div class="check-desc">Descripción</div>
          </div>
        </div>

        <button type="submit" class="btn btn-register w-100 py-2">
          Registro
        </button>
      </form>
    </div>
  </div>
</div>

<!-- Bootstrap JS (opcional) -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
